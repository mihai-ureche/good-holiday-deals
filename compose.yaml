name: good-holiday-deals

x-app: &app
  image: good-holiday-deals:local
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 5m, max-file: "2" }
  networks: [holiday]
  depends_on:
    db: { condition: service_healthy }
  environment: &environment
    NODE_ENV: ${NODE_ENV:-development}
    APP_URL: ${APP_URL:-http://localhost:3000}
    DATABASE_URL: postgres://holiday:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/holiday
    DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Bucharest}
    EMAIL_MODE: ${EMAIL_MODE:-disabled}
    IGNAV_API_KEY: ${IGNAV_API_KEY:-}
    DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
    DUFFEL_LINKS_APP_URL: ${DUFFEL_LINKS_APP_URL:-}

services:
  api:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    mem_limit: 256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *app
    command: [node, dist/apps/worker/src/main.js]
    mem_limit: 256m
    stop_grace_period: 90s
    environment:
      <<: *environment
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holiday
      POSTGRES_DB: holiday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20, -c, work_mem=2MB]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 192m
    networks: [holiday]
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U holiday -d holiday"]
      interval: 5s
      timeout: 3s
      retries: 20

  proxy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_HOST: ${APP_HOST:-travel.binarium.ro}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    networks:
      holiday: { ipv4_address: 172.30.83.2 }
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
networks:
  holiday:
    ipam:
      config: [{ subnet: 172.30.83.0/24 }]
